<style>
/* widen the main container + breathing room — desktop only */
@media (min-width: 64em) {
  #main { padding-left: 4em; }
}
@media (min-width: 80em) {
  #main { max-width: 1380px; }
}
/* shrink the theme's empty right gutter (suffix 2 of 12) so content runs wider */
@media (min-width: 64em) {
  .page { padding-right: 2em; }
}
/* drop the 2em top margin the theme puts on every heading, for the first one */
.page__content > h2:first-child {
  margin-top: 0;
}
html {
  scroll-behavior: smooth;
}
/* Offset anchor jumps so content isn't hidden under the sticky masthead */
h2[id] {
  scroll-margin-top: 80px;
}
.pub-heading-meta {
  font-size: 0.8rem;
  font-weight: normal;
  color: var(--global-text-color-light);
}
.nowrap { white-space: nowrap; }
/* small logo inline before an organization name in running text */
img.inline-logo {
  display: inline;
  height: 1.15em;
  width: auto;
  max-width: 2.6em;
  object-fit: contain;
  vertical-align: -0.2em;
  margin-right: 0.28em;
  border-radius: 2px;
}
.pub-legend {
  font-size: 0.65rem;
  font-style: italic;
}
.pub-heading-meta a {
  color: var(--global-link-color);
}
.paper-box {
  display: flex;
  gap: 1rem;
  padding: 0.9rem 0;
  border-bottom: 1px solid var(--global-border-color);
  /* row height = taller of image and text; the shorter one is centered */
  align-items: center;
}
.paper-box:last-child { border-bottom: none; }
/* fixed width; height follows the image's own aspect ratio */
.paper-box-image {
  flex: 0 0 260px;
  max-width: 260px;
  overflow: hidden;
  border: 1px solid var(--global-border-color);
  border-radius: 4px;
  background: #fff;
}
@media (min-width: 80em) {
  .paper-box-image { flex-basis: 320px; max-width: 320px; }
}
.paper-box-image img {
  width: 100%;
  height: auto;
  display: block;
}
.paper-box-text { flex: 1; min-width: 0; }
.paper-box-text p { margin: 0.25rem 0; }
.paper-title {
  font-weight: 600;
  font-size: 0.98rem;
  line-height: 1.4;
  color: var(--global-text-color);
}
.paper-box .paper-authors {
  font-size: 0.8rem !important;
  color: var(--global-text-color-light);
  line-height: 1.5;
}
.paper-authors u {
  color: var(--global-text-color);
  font-weight: 600;
  text-decoration: none;
}
.paper-authors b { color: var(--global-text-color); font-weight: 600; }
.paper-box .paper-award {
  font-size: 0.87rem !important;
  font-weight: 700;
  color: #d32f2f;
  line-height: 1.5;
}
.paper-desc {
  font-size: 0.87rem;
  color: var(--global-text-color-light);
  line-height: 1.5;
}
.paper-box .paper-links { font-size: 0.72rem !important; color: var(--global-text-color-light); }
.paper-box .paper-links .pub-text-link {
  color: var(--global-text-color) !important;
  font-size: 0.65rem !important;
  text-decoration: none;
}
.paper-box .paper-links .pub-text-link:hover { text-decoration: underline; }
.paper-box .paper-links .stars-badge { height: 18px; vertical-align: -20%; }
.pub-venue {
  font-weight: 600;
  font-size: 0.8rem;
  color: var(--global-link-color);
  padding: 0.1rem 0.5rem;
  background: var(--global-footer-bg-color);
  border: 1px solid var(--global-border-color);
  border-radius: 4px;
}
.paper-links a {
  font-size: 0.8rem;
  padding: 0.1rem 0.5rem;
  background: var(--global-footer-bg-color);
  border: 1px solid var(--global-border-color);
  border-radius: 4px;
  color: var(--global-link-color);
  text-decoration: none;
  margin-left: 0.25rem;
}
.paper-links a:hover {
  background: var(--global-link-color);
  color: #fff;
  text-decoration: none;
}
@media (max-width: 600px) {
  .paper-box { flex-direction: column; align-items: stretch; }
  .paper-box-image {
    flex: unset;
    width: 100%;
    max-width: 100%;
  }
}
ul.timeline {
  list-style: none;
  padding-left: 0;
}
ul.timeline li {
  padding: 0.5rem 0;
  border-left: 2px solid var(--global-border-color);
  padding-left: 1rem;
  margin-bottom: 0.4rem;
}
.timeline-meta {
  display: block;
  color: var(--global-text-color-light);
  font-size: 0.88rem;
  margin-top: 0.15rem;
}
ul.timeline.with-logos li {
  display: flex;
  align-items: center;
  gap: 0.9rem;
}
.timeline-logo {
  flex: 0 0 44px;
  width: 44px;
  height: 44px;
  object-fit: contain;
  border: 1px solid var(--global-border-color);
  border-radius: 8px;
  background: #fff;
}
.timeline-desc {
  display: block;
  color: var(--global-text-color-light);
  font-size: 0.88rem;
  line-height: 1.5;
  margin-top: 0.2rem;
}
</style>
